name: Build Mesa 25 R300 legacy DRI2 (experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mesa-dri2:
    name: Debian 13 amd64 Mesa DRI2 compatibility build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: debian:trixie

    steps:
      - name: Enable Debian source repositories and install build tools
        shell: bash
        run: |
          set -euo pipefail
          cat > /etc/apt/sources.list.d/mesa-source.sources <<'EOF'
          Types: deb-src
          URIs: http://deb.debian.org/debian
          Suites: trixie trixie-updates
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.pgp
          EOF
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates devscripts dpkg-dev \
            meson ninja-build pkg-config python3 python3-mako python3-yaml \
            git tar xz-utils binutils patchelf file
          DEBIAN_FRONTEND=noninteractive apt-get build-dep -y mesa

      - name: Check out PearMac packaging scripts
        uses: actions/checkout@v4

      - name: Fetch Debian 13 Mesa source with Debian patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mesa-work
          cd /tmp/mesa-work
          apt-get source mesa=25.0.7-2+deb13u1
          src_dir="$(find . -maxdepth 1 -type d -name 'mesa-*' | head -n 1)"
          test -n "$src_dir"
          echo "MESA_SOURCE=$PWD/${src_dir#./}" >> "$GITHUB_ENV"

      - name: Configure reduced R300 + software fallback Mesa build
        shell: bash
        run: |
          set -euo pipefail
          cd "$MESA_SOURCE"
          meson setup build-legacy \
            --prefix=/opt/pearmac-mesa-dri2 \
            --libdir=lib/x86_64-linux-gnu \
            --buildtype=release \
            -Dlegacy-x11=dri2 \
            -Dglx=dri \
            -Dglx-direct=true \
            -Dglvnd=true \
            -Dgallium-drivers=r300,softpipe,llvmpipe \
            -Dvulkan-drivers= \
            -Dllvm=enabled \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dgallium-va=disabled \
            -Dgallium-vdpau=disabled \
            -Dgallium-opencl=disabled
          meson configure build-legacy | tee /tmp/mesa-configure.txt
          grep -Eq 'legacy-x11.*dri2' /tmp/mesa-configure.txt || {
            echo 'ERROR: DRI2 legacy option not present in resolved Meson configuration'
            exit 1
          }

      - name: Compile and stage only (never install on runner system)
        shell: bash
        run: |
          set -euo pipefail
          cd "$MESA_SOURCE"
          meson compile -C build-legacy -j 4
          DESTDIR=/tmp/mesa-stage meson install -C build-legacy
          test -d /tmp/mesa-stage/opt/pearmac-mesa-dri2/lib/x86_64-linux-gnu
          mkdir -p /tmp/mesa-output
          cp /tmp/mesa-configure.txt /tmp/mesa-output/meson-configure.txt
          cp -a /tmp/mesa-stage/opt/pearmac-mesa-dri2 /tmp/mesa-output/
          find /tmp/mesa-output/pearmac-mesa-dri2 -type f -name '*.so*' -exec file {} \; > /tmp/mesa-output/libraries.txt || true
          cat > /tmp/mesa-output/README.txt <<'EOF'
          EXPERIMENTAL PearMac Radeon X1600 Mesa 25.0.7 DRI2 libraries
          Built in a Debian 13 (trixie) amd64 container, with -Dlegacy-x11=dri2.
          THIS ARCHIVE IS NOT A BOOTABLE ISO OR AN INSTALLER.

          Do not overwrite /usr/lib or system Mesa on the working iMac.
          No hardware access exists on the CI runner: successful compilation does
          NOT prove GPU acceleration, ABI compatibility, or operational stability.
          Test these libraries in a separate directory with a controlled per-process
          environment before any system integration.
          The preexisting Xorg radeon kernel/EXA configuration remains untouched.
          EOF

      - name: Build reversible system-wide Debian GLX override package
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package-mesa-dri2.sh \
            /tmp/mesa-output/pearmac-mesa-dri2 /tmp/mesa-deb

      - name: Validate package install, loader selection and rollback in Debian 13
        shell: bash
        run: |
          set -euo pipefail
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libglx-mesa0 mesa-libgallium libgl1-mesa-dri
          baseline="$(ldconfig -p | grep 'libGLX_mesa.so.0 ' || true)"
          echo "Default library: $baseline"
          dpkg -i /tmp/mesa-deb/pearmac-mesa-r300-dri2_*.deb
          ldconfig -p | grep 'libGLX_mesa.so.0 '
          ldconfig -p | grep 'libGLX_mesa.so.0 ' | grep -F /opt/pearmac-radeon/lib/
          ldd /opt/pearmac-radeon/lib/libGLX_mesa.so.0 | tee /tmp/pearmac-ldd.txt
          grep -E 'libgallium-25[.]0[.]7[.]so => /opt/pearmac-radeon/(lib/[.][.]/)?private/libgallium-25[.]0[.]7[.]so' /tmp/pearmac-ldd.txt
          dpkg -r pearmac-mesa-r300-dri2
          if ldconfig -p | grep 'libGLX_mesa.so.0 ' | grep -F /opt/pearmac-radeon/lib/; then
            echo "ERROR: package removal failed to restore original loader"
            exit 1
          fi
          ldconfig -p | grep 'libGLX_mesa.so.0 '

      - name: Upload system-wide test Debian package
        uses: actions/upload-artifact@v4
        with:
          name: PearMac-Radeon-Systemwide-DEB-EXPERIMENTAL
          path: /tmp/mesa-deb/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload experimental Mesa artifact
        uses: actions/upload-artifact@v4
        with:
          name: PearMac-Mesa25-R300-Legacy-DRI2-TEST
          path: /tmp/mesa-output/
          if-no-files-found: error
          retention-days: 14
